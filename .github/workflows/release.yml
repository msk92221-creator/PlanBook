# 태그(vX.Y.Z)를 푸시하면 Windows/Android 빌드를 만들어 GitHub 릴리스로 올린다.
# 로컬 Windows 머신 없이도 릴리스를 낼 수 있게 하는 것이 목적이다.
name: Release

on:
  push:
    tags:
      - 'v*'
  # 태그를 새로 만들지 않고 기존 태그로 다시 돌리고 싶을 때 수동 실행.
  workflow_dispatch:
    inputs:
      tag:
        description: '릴리스할 태그 (예: v1.0.2)'
        required: true

# 릴리스 생성/자산 업로드에 쓰기 권한이 필요하다.
permissions:
  contents: write

env:
  # pubspec.yaml 의 `environment: sdk: ^3.12.2` 와 맞는 Flutter 버전.
  FLUTTER_VERSION: '3.44.9'

jobs:
  # 태그 이름을 한 곳에서 정해 두고 모든 잡이 같은 값을 쓰게 한다
  # (push 트리거면 밀린 태그, 수동 실행이면 입력값).
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - id: pick
        run: echo "tag=${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-windows:
    needs: [version, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: flutter build windows --release
      # Release 폴더 전체(exe + dll + data)를 통째로 압축해야 실행된다.
      - name: Zip release folder
        shell: pwsh
        run: |
          Compress-Archive `
            -Path build\windows\x64\runner\Release\* `
            -DestinationPath "PlanBook-windows-${{ needs.version.outputs.tag }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: PlanBook-windows-*.zip

  build-android:
    needs: [version, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      # release APK 를 CI 시크릿으로 주입한 고정 keystore 로 서명한다.
      # 이 스텝 없이 조용히 debug 키로 폴백하면 덮어쓰기 불가능한 APK 가 또 나가므로,
      # 시크릿이 비어 있으면 명시적으로 실패시킨다.
      - name: Prepare release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 시크릿이 없습니다. release APK 서명용 keystore 없이 빌드할 수 없습니다. CI 시크릿(keystore base64, store password, key alias, key password)을 먼저 설정하세요."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/planbook-release.jks
          printf 'storeFile=planbook-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
      - run: flutter build apk --release
      # 서명 인증서의 SHA-256 지문을 로그에 남겨, 다음 릴리스 때 서명이 같은지
      # 사람이 눈으로 확인할 수 있게 한다. apksigner 는 Android SDK build-tools 에 있다.
      - name: Verify signing certificate
        continue-on-error: true
        run: |
          apk="build/app/outputs/flutter-apk/app-release.apk"
          apksigner="$(echo "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | tr ' ' '\n' | sort -V | tail -n1)"
          if [ -z "$apksigner" ] || [ ! -x "$apksigner" ]; then
            echo "apksigner 를 찾을 수 없어 서명 검증을 건너뜁니다."
            exit 0
          fi
          "$apksigner" verify --print-certs "$apk" | grep -E 'SHA-256'
      - name: Rename apk
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             "PlanBook-android-${{ needs.version.outputs.tag }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: PlanBook-android-*.apk

  publish:
    needs: [version, build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      # 릴리스 노트 파일(.github/release-notes/<tag>.md)을 읽기 위해 체크아웃한다.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          notes=".github/release-notes/${TAG}.md"
          if [ -f "$notes" ]; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "PlanBook $TAG" --notes-file "$notes" dist/*
          else
            # 노트 파일을 깜빡했더라도 릴리스 자체는 나가게 한다.
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "PlanBook $TAG" --generate-notes dist/*
          fi
